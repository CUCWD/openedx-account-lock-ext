[tox]
envlist = django52,custom-user,quality,docs

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120

[testenv]
package = wheel
extras = test
setenv =
    DJANGO_SETTINGS_MODULE = tests.settings
    PYTHONPATH = {toxinidir}
deps =
    Django==5.2.11
    -r{toxinidir}/requirements/test.txt
commands =
    python -m django check
    python -m pytest {posargs} --cov-report=xml

[testenv:docs]
description = Build packages and validate README metadata
skip_install = true
extras =
deps =
    -r{toxinidir}/requirements/doc.txt
commands =
    python -m build --outdir {envtmpdir}/dist
    python -m twine check --strict {envtmpdir}/dist/*

[testenv:quality]
extras = quality
setenv =
    {[testenv]setenv}
    PYLINTHOME = {envtmpdir}/pylint
deps =
    Django==5.2.11
    -r{toxinidir}/requirements/quality.txt
commands =
    python -m pylint openedx_account_lock_ext
    python -m pycodestyle --max-line-length=120 openedx_account_lock_ext tests
    python -m pydocstyle openedx_account_lock_ext
    python -m isort --check-only --diff openedx_account_lock_ext tests
    python -m mypy openedx_account_lock_ext

[testenv:custom-user]
setenv =
    DJANGO_SETTINGS_MODULE = tests.custom_settings
    PYTHONPATH = {toxinidir}
commands =
    python -m django check
    python -m pytest --ds=tests.custom_settings tests/custom_model_cases.py {posargs}
